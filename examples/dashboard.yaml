# Register /ultrahuman/ultrahuman-ring-card.js as a JavaScript module resource
# if automatic resource registration is unavailable.
#
# Replace these prefixes with your actual entity prefixes from Developer Tools
# → States. One prefix identifies one daily account or one Home device.
# These example prefixes are placeholders; generated names depend on your setup.
type: vertical-stack
cards:
  - type: custom:ultrahuman-ring-card
    entity_prefix: sensor.ultrahuman_ring_your_account
  - type: custom:ultrahuman-home-card
    entity_prefix: sensor.ultrahuman_home_living_aabbccddeeff
    title: Living Room
  - type: custom:ultrahuman-home-card
    entity_prefix: sensor.ultrahuman_home_bedroom_112233445566
    title: Bedroom
